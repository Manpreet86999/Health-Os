plugins {
    id 'com.android.library' version '9.1.1'
}
android {
    namespace 'app.healthos.nativebridge'
    compileSdk 37
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly project(':capacitor')
    implementation 'androidx.health.connect:connect-client:1.2.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    compileOnly 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}
tasks.register('exportRuntime') {
    dependsOn 'assembleRelease'
    doLast {
        def destination = file('build/runtime'); destination.mkdirs()
        configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy { from artifact.file; into destination }
        }
    }
}
